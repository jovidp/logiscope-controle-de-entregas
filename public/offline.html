<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sem conexao | Controle de Entrega</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        background: #141e2e;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 18px 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 22px; color: #94a3b8; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #38bdf8;
        color: #0f172a;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/icon-192.png" alt="" />
      <h1>Voce esta sem conexao</h1>
      <p>Os dados do sistema nao sao armazenados no aparelho. Reconecte-se para continuar com informacoes atualizadas.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
